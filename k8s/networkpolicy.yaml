# Default-deny for incoming traffic in the namespace, then allow only the application port.
# Needs a network plugin that enforces NetworkPolicy (TODO verify on the test cluster).
# Egress is not restricted: the database location is not in the repository (see RISKS.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: stockdesk
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-stockdesk-http
  namespace: stockdesk
spec:
  podSelector:
    matchLabels:
      app: stockdesk
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
      # TODO: restrict "from" to the ingress controller's namespace once the Ingress exists.