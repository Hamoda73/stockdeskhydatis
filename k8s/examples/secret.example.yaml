# EXAMPLE ONLY. Never fill in real values in this file and never commit a filled copy.
#
# The ".example" extension is deliberate: `kubectl apply -f k8s/` only reads .yaml/.yml/.json files,
# so this sample can never overwrite the real secret by accident. CI applies manifests by name
# (see .github/workflows/ci.yml), so this folder is not deployed either.
#
# Real way to create the secret. The values never go in the repository, and never on the command
# line (command lines end up in shell history and in the process list):
#   1. umask 077, then create a temporary file OUTSIDE the repository, for example "$HOME/stockdesk.env",
#      with one KEY=value line per variable below (the real values: a new password and a new key).
#   2. kubectl -n stockdesk create secret generic stockdesk-env \
#        --from-env-file="$HOME/stockdesk.env" --dry-run=client -o yaml | kubectl apply -f -
#   3. Delete the temporary file right away.
# The same steps rotate the values later. Pods read the secret at start, so after a rotation run:
#   kubectl -n stockdesk rollout restart deployment/stockdesk
#
# TODO verify: these variable names against .env and src/ (the application's names must not change).
apiVersion: v1
kind: Secret
metadata:
  name: stockdesk-env
  namespace: stockdesk
type: Opaque
stringData:
  DB_HOST: db
  DB_PORT: "5432"
  DB_USER: stockdesk
  DB_PASSWORD: CHANGE_ME_EXAMPLE
  API_KEY: CHANGE_ME_EXAMPLE
